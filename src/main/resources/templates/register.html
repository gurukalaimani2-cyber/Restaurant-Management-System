<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Restaurant Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="login-icon mb-3">
                                <span class="fs-1">🍽️</span>
                            </div>
                            <h3 class="fw-bold">Create Customer Account</h3>
                            <p class="text-muted">Sign up to order food and book tables</p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                        <form th:action="@{/register}" th:object="${user}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Choose a Username</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}"
                                       placeholder="Enter a username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Choose a Password</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}"
                                       placeholder="Enter a password" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Register</button>
                            </div>
                        </form>

                        <p class="text-center mt-3 mb-0">
                            <a th:href="@{/login}">Already have an account? Sign in</a>
                        </p>
                    </div>
                </div>
                <p class="text-center text-white mt-3 small">&copy; 2026 Restaurant Management System</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
