<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${item.id} != null ? 'Edit Stock Item' : 'New Stock Item'">Inventory Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🍽️ Restaurant Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto"></ul>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="nav-link text-light" sec:authentication="name">Admin</span></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4 px-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card dashboard-card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4" th:text="${item.id} != null ? 'Edit Stock Item' : 'New Stock Item'"></h4>

                        <form th:action="@{/inventory/save}" th:object="${item}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label">Item Name</label>
                                <input type="text" class="form-control" th:field="*{itemName}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Quantity</label>
                                    <input type="number" step="0.01" min="0" class="form-control" th:field="*{quantity}" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Unit</label>
                                    <select class="form-select" th:field="*{unit}" required>
                                        <option value="kg">kg</option>
                                        <option value="litre">litre</option>
                                        <option value="pcs">pcs</option>
                                        <option value="gram">gram</option>
                                        <option value="packet">packet</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Reorder Level</label>
                                    <input type="number" step="0.01" min="0" class="form-control" th:field="*{reorderLevel}" required>
                                    <div class="form-text">Alerts when quantity drops to this or below.</div>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Save</button>
                                <a th:href="@{/inventory}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted mt-5 mb-3">
        <small>&copy; 2026 Restaurant Management System. All rights reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
