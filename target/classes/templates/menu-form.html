<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${menuItem.id} != null ? 'Edit Menu Item' : 'New Menu Item'">Menu Item Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🍽️ Restaurant Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto"></ul>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="nav-link text-light" sec:authentication="name">Admin</span></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4 px-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card dashboard-card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4" th:text="${menuItem.id} != null ? 'Edit Menu Item' : 'New Menu Item'"></h4>

                        <form th:action="@{/menu/save}" th:object="${menuItem}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label">Item Name</label>
                                <input type="text" class="form-control" th:field="*{itemName}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" th:field="*{category}" required>
                                    <option value="Starter">Starter</option>
                                    <option value="Main Course">Main Course</option>
                                    <option value="Dessert">Dessert</option>
                                    <option value="Beverage">Beverage</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Price (₹)</label>
                                <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="available" th:field="*{available}">
                                <label class="form-check-label" for="available">Available</label>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Save</button>
                                <a th:href="@{/menu}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted mt-5 mb-3">
        <small>&copy; 2026 Restaurant Management System. All rights reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
