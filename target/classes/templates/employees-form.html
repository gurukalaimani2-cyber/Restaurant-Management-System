<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${employee.id} != null ? 'Edit Employee' : 'New Employee'">Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🍽️ Restaurant Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto"></ul>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="nav-link text-light" sec:authentication="name">Admin</span></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4 px-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card dashboard-card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4" th:text="${employee.id} != null ? 'Edit Employee' : 'New Employee'"></h4>

                        <form th:action="@{/employees/save}" th:object="${employee}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" th:field="*{fullName}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Position</label>
                                    <select class="form-select" th:field="*{position}" required>
                                        <option value="Manager">Manager</option>
                                        <option value="Chef">Chef</option>
                                        <option value="Waiter">Waiter</option>
                                        <option value="Cashier">Cashier</option>
                                        <option value="Cleaner">Cleaner</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Phone</label>
                                    <input type="text" class="form-control" th:field="*{phone}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Salary (₹)</label>
                                    <input type="number" step="0.01" min="0" class="form-control" th:field="*{salary}" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Joining Date</label>
                                    <input type="date" class="form-control" th:field="*{joiningDate}" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Status</label>
                                    <select class="form-select" th:field="*{status}">
                                        <option value="ACTIVE">ACTIVE</option>
                                        <option value="INACTIVE">INACTIVE</option>
                                    </select>
                                </div>
                            </div>

                            <hr class="my-4">
                            <h6 class="fw-bold mb-1">Portal Login</h6>
                            <p class="text-muted small mb-3">
                                Optional. Set a username (and a password) to let this employee sign in to their own
                                staff portal — orders, reservations, attendance, and their profile.
                            </p>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" th:field="*{username}"
                                           placeholder="Leave blank for no portal access">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" name="password"
                                           placeholder="Leave blank to keep current password">
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Save</button>
                                <a th:href="@{/employees}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted mt-5 mb-3">
        <small>&copy; 2026 Restaurant Management System. All rights reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
