<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Bill - Restaurant Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🍽️ Restaurant Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto"></ul>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="nav-link text-light" sec:authentication="name">Admin</span></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4 px-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card dashboard-card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">Generate Bill</h4>

                        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
                            All orders already have a bill. Place a new order first if you need to bill another one.
                        </div>

                        <form th:if="${!#lists.isEmpty(orders)}" th:action="@{/billing/generate}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Order</label>
                                <select name="orderId" class="form-select" required>
                                    <option value="" disabled selected>Select an order</option>
                                    <option th:each="o : ${orders}"
                                            th:value="${o.id}"
                                            th:text="'Order #' + ${o.id} + ' — ' + ${o.customerName} + ' — ₹' + ${o.totalAmount}">
                                    </option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Tax (%)</label>
                                    <input type="number" step="0.01" min="0" name="taxPercent" class="form-control" value="5" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Discount (₹)</label>
                                    <input type="number" step="0.01" min="0" name="discount" class="form-control" value="0" required>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Generate Bill</button>
                                <a th:href="@{/billing}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted mt-5 mb-3">
        <small>&copy; 2026 Restaurant Management System. All rights reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
