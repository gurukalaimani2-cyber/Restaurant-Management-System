<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Order - Restaurant Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" th:href="@{/customer/dashboard}">🍽️ Restaurant Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto"></ul>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="nav-link text-light" sec:authentication="name">Customer</span></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4 px-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card dashboard-card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">Place a New Order</h4>

                        <form th:action="@{/customer/orders/save}" th:object="${order}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Table Number</label>
                                <input type="number" min="1" class="form-control" th:field="*{tableNumber}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Items You'd Like to Order</label>
                                <textarea class="form-control" rows="3" th:field="*{itemsOrdered}"
                                          placeholder="e.g. 2x Butter Chicken, 1x Masala Chai" required></textarea>
                                <div class="form-text">
                                    Check <a th:href="@{/customer/menu}">the menu</a> for item names and prices.
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Estimated Total (₹)</label>
                                <input type="number" step="0.01" min="0" class="form-control" th:field="*{totalAmount}" required>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Place Order</button>
                                <a th:href="@{/customer/orders}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted mt-5 mb-3">
        <small>&copy; 2026 Restaurant Management System. All rights reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
