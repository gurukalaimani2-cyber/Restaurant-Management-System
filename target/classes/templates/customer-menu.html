<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Restaurant Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" th:href="@{/customer/dashboard}">🍽️ Restaurant Management System</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/customer/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/customer/menu}">Menu</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/customer/orders}">My Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/customer/reservation}">My Reservations</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="nav-link text-light" sec:authentication="name">Customer</span></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid mt-4 px-4">
        <h2 class="fw-bold mb-3">Our Menu</h2>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Price (₹)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${menuItems}">
                            <td th:text="${item.itemName}">Item</td>
                            <td th:text="${item.category}">Category</td>
                            <td th:text="${item.description}">Description</td>
                            <td th:text="${item.price}">0.00</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(menuItems)}">
                            <td colspan="4" class="text-center text-muted">No items available right now.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a th:href="@{/customer/orders/new}" class="btn btn-primary mt-3">Place an Order</a>
    </div>

    <footer class="text-center text-muted mt-5 mb-3">
        <small>&copy; 2026 Restaurant Management System. All rights reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
